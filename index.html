<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form with Full Validation</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="container">
        <h2>Student Registration Form</h2>
        <form id="registration-form">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
                <div id="name-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="18" max="99" placeholder="Enter your age">
                <div id="age-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group" id="gender-input">
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </div>
                <div id="gender-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="" disabled selected>Select a Course</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                </select>
                <div id="course-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address">
                <div id="email-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 characters">
                <div id="password-error" class="error-message"></div>
            </div>

            <button type="submit" id="submit-btn" disabled>
                Register Student
            </button>

        </form>

        <hr>
        <h3>Registered List</h3>
        <table id="registered-list-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="student-list-body">
                <tr><td colspan="6" style="text-align: center;">No students registered yet.</td></tr>
            </tbody>
        </table>
    </div>

 <script src="script.js"></script>   

</body>
</html>
